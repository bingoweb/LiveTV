name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          # WebTorrent 3.0.21 transitively pulls ip@2.0.1 (GHSA-2p57-rm9w-gvfp).
          # LiveTV uses WebTorrent only in the browser and exposes no server-side
          # arbitrary-URL/SSRF proxy. Upstream currently has no modern fixed range;
          # remove this single advisory exception as soon as WebTorrent resolves it.
          allow-ghsas: GHSA-2p57-rm9w-gvfp
